name: Goyang Existing Worker Domain Attach

on:
  workflow_dispatch:
    inputs:
      confirm_unused:
        description: I confirm goyang.fwith.kr is unused and authorize attaching it to the existing QA Worker without asset deployment.
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: site-staging-${{ github.repository }}
  cancel-in-progress: false
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Require fixed-host operator confirmation
        env:
          CONFIRM_UNUSED: ${{ inputs.confirm_unused }}
        run: |
          test "$CONFIRM_UNUSED" = true || { echo 'Operator confirmation required; no attach attempted.' >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Assert unchanged paused Goyang contract
        working-directory: control
        run: |
          python3 - <<'PYTHON'
          import json
          site=json.load(open('.github/site-factory-sites.json'))['sites']['goyang-flower-v2']
          assert site['repo']=='joseungil-kr/fwith-site-factory' and site['siteUrl']=='https://goyang.fwith.kr'
          assert site['branch']=='site-factory-goyang-v2' and site['root']=='site-factory/goyang-flower'
          assert site['stagingUrl']=='https://goyang-flower-guide-qa.joseungil.workers.dev'
          assert site['productionEnabled'] is False and site['launchMode']=='staging'
          assert site['growthPaused'] is True and site['autoDeploySnapshots'] is False
          assert site['indexnowKey']==''
          PYTHON
      - name: Attach hostname only to existing QA Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 control/site-factory/engine/goyang_domain_attach.py --operator-confirmed-unused
