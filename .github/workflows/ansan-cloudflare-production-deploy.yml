name: Ansan Cloudflare Production Deploy

on:
  push:
    branches:
      - site-factory-ansan-v1
    paths:
      - "site-factory/ansan-flower/**"
      - ".github/workflows/ansan-cloudflare-production-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ansan-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-factory/ansan-flower
    env:
      SITE_URL: https://ansan.fwith.kr
      SITE_INDEXABLE: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate production gate and secrets
        shell: bash
        run: |
          set -euo pipefail
          test -f production-indexing.enabled
          test -n "$CLOUDFLARE_API_TOKEN"
          if ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[0-9A-Fa-f]{32}$'; then
            echo "CLOUDFLARE_ACCOUNT_ID must be the 32-character Cloudflare Account ID."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Build production site
        run: npm run build

      - name: Static SEO QA
        run: python3 scripts/qa_static.py

      - name: Site graph QA
        run: node scripts/qa_site_graph.mjs

      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@latest deploy

      - name: Verify exact production revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import quote

          base="https://ansan.fwith.kr"
          expected=os.environ["EXPECTED_REVISION"]
          with open("src/data/business-truth.json",encoding="utf-8") as truth_file:
              business=json.load(truth_file)

          class Banner(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links=[]; self.current=None; self.images=0; self.text=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="img": self.images+=1
                  if tag=="a":
                      self.current=[dict(attrs).get("href"),[]]
                      self.links.append(self.current)
              def handle_data(self,data):
                  self.text.append(data)
                  if self.current is not None: self.current[1].append(data)
              def handle_endtag(self,tag):
                  if tag=="a": self.current=None

          def get(path):
              req=urllib.request.Request(base+quote(path,safe="/"),headers={"User-Agent":"SiteFactory-ProductionQA/1.0"})
              with urllib.request.urlopen(req,timeout=30) as res:
                  return res.status,res.read().decode("utf-8",errors="replace")

          last=None
          for attempt in range(1,61):
              try:
                  code,home=get("/")
                  assert code==200
                  lower=home.lower()
                  assert f'name="site-factory-revision" content="{expected}"' in home
                  assert "index,follow" in lower and "noindex" not in lower

                  code,robots=get("/robots.txt")
                  assert code==200
                  assert "Allow: /" in robots and "Disallow: /" not in robots

                  code,article=get("/안산꽃배달/")
                  assert code==200
                  assert f'name="site-factory-revision" content="{expected}"' in article, "Stale representative article revision"
                  banners=re.findall(r'<figure class="content-order-banner"[^>]*>[\s\S]*?</figure>',article)
                  assert banners, "Missing accessible order CTA"
                  for markup in banners:
                      banner=Banner(); banner.feed(markup)
                      links={(href," ".join("".join(label).split())) for href,label in banner.links}
                      assert banner.images==0 and "최저가" not in "".join(banner.text), "Unsupported image or price claim in order CTA"
                      assert (business["phoneHref"],f'전화 주문 {business["phone"]}') in links, "Wrong or missing telephone CTA"
                      assert (business["onlineOrderUrl"],"온라인 주문") in links, "Wrong or missing online order CTA"
                  assert "index,follow" in article.lower() and "noindex" not in article.lower()
                  print("ANSAN PRODUCTION DEPLOY QA PASSED")
                  break
              except Exception as exc:
                  last=exc
                  print(f"Attempt {attempt}/60: {exc}")
                  time.sleep(5)
          else:
              raise SystemExit(f"Production did not become ready: {last}")
          PY
