name: Suwon Isolated Preview
on:
  workflow_dispatch:
    inputs:
      expected_revision: {description: Full reviewed target source SHA, required: true, type: string}
permissions: {}
jobs:
  common-pipeline:
    permissions: {contents: read, issues: write}
    uses: joseungil-kr/fwith-site-factory/.github/workflows/site-staging-deploy.yml@main
    with:
      site_key: suwon-flower-test
      expected_revision: ${{ inputs.expected_revision }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
