name: Goyang Staging HTTP QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goyang-staging-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control verification helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify fixed Goyang custom domain canonical noindex revision and snapshot
        run: python3 site-factory/engine/verify_goyang_canonical.py http --report goyang-preview-verification.json

      - name: Save Goyang HTTP QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goyang-http-qa-${{ github.run_id }}
          path: goyang-preview-verification.json
          if-no-files-found: error
          retention-days: 7
