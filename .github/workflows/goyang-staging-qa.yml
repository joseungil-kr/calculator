name: Goyang Staging HTTP QA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Fixed historical HTTP QA or GET-only preview capability observation
        required: true
        default: fixed-http
        type: choice
        options: [fixed-http, preview-capabilities]
      scope_key: {description: Exact registered scope for capability observation, required: false, type: string}
      expected_revision: {description: Exact registered reviewed source reference, required: false, type: string}
  issues:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  goyang-staging-qa:
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'preview-capabilities'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control verification helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify fixed Goyang custom domain canonical noindex revision and snapshot
        run: python3 site-factory/engine/verify_goyang_canonical.py http --report goyang-preview-verification.json

      - name: Save Goyang HTTP QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goyang-http-qa-${{ github.run_id }}
          path: goyang-preview-verification.json
          if-no-files-found: error
          retention-days: 7

  preview-capabilities:
    if: github.ref == 'refs/heads/main' && (inputs.mode == 'preview-capabilities' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[GOYANG-PREVIEW-INSPECT]')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authorize repository writer before account read
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.payload.repository;
            const users = new Set([context.actor]);
            if (context.payload.issue) users.add(context.payload.issue.user.login);
            for (const username of users) {
              if (repo.owner.type === 'User' && username === repo.owner.login) continue;
              const result = await github.rest.repos.getCollaboratorPermissionLevel({...context.repo, username});
              if (!['admin', 'maintain', 'write'].includes(result.data.permission)) {
                throw new Error('Untrusted inspection actor or author');
              }
            }
      - uses: actions/checkout@v4
        with: {ref: main, path: control, persist-credentials: false}
      - name: Require exact registered Goyang inspection scope
        env:
          SCOPE_KEY: ${{ inputs.scope_key }}
          REVISION: ${{ inputs.expected_revision }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          values={}
          for line in os.environ.get('ISSUE_BODY','').splitlines():
              if ': ' in line:
                  key,value=line.split(': ',1)
                  if key in values:raise SystemExit('Duplicate inspection header')
                  values[key]=value
          scope=os.environ.get('SCOPE_KEY') or values.get('SCOPE_KEY','')
          revision=os.environ.get('REVISION') or values.get('EXPECTED_REVISION','')
          expected_scope='goyang-flower-v2-dong-coverage-20261003'
          if scope!=expected_scope or (os.environ['EVENT_NAME']=='issues' and (values.get('SITE_KEY')!='goyang-flower-v2' or values.get('LAUNCH_KEY')!=expected_scope)):
              raise SystemExit('Unregistered inspection scope')
          site=json.load(open('control/.github/site-factory-sites.json'))['sites']['goyang-flower-v2']
          identity={'repo':'joseungil-kr/fwith-site-factory','branch':'site-factory-goyang-v2','root':'site-factory/goyang-flower','siteUrl':'https://goyang.fwith.kr','worker':'goyang-flower-prod-disabled','stagingWranglerConfig':'wrangler.staging.jsonc'}
          coverage=site.get('coverageDeployment',{})
          if os.environ['GITHUB_REPOSITORY']!=identity['repo'] or any(site.get(k)!=v for k,v in identity.items()):raise SystemExit('Registered identity mismatch')
          if coverage.get('worker')!='goyang-flower-guide-qa' or coverage.get('canonicalOrigin')!=identity['siteUrl'] or coverage.get('wranglerConfig')!='wrangler.staging.jsonc' or coverage.get('scopeKey')!=scope or coverage.get('launchKey')!=scope:raise SystemExit('Bound Worker/scope mismatch')
          if site.get('growthPaused') is not True or site.get('autoDeploySnapshots') is not False or site.get('requireRevisionApproval') is not True or site.get('requireSnapshotApproval') is not True:raise SystemExit('Approval policy mismatch')
          references=[(coverage.get('previewRevision'),coverage.get('previewApprovalEvidenceUrl')),(site.get('approvedRevision'),site.get('approvalEvidenceUrl'))]
          if not re.fullmatch('[0-9a-f]{40}',revision) or not any(rev==revision and re.fullmatch(r'https://github\.com/joseungil-kr/fwith-site-factory/(?:issues|pull|commit)/[^\s?#]+(?:#[^\s]+)?',evidence or '') for rev,evidence in references):raise SystemExit('Unreviewed source reference')
          print('Registered Goyang reference validated; GET-only inspection, no deployment or setting changes.')
          PYTHON
      - name: Observe existing preview capability and active deployment without mutations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 control/site-factory/engine/verify_goyang_canonical.py preview-capabilities --report goyang-preview-capabilities.json
      - name: Save filtered capability observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goyang-preview-capabilities-${{ github.run_id }}
          path: goyang-preview-capabilities.json
          if-no-files-found: warn
          retention-days: 7
