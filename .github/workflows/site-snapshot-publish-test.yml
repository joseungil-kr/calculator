name: Site Factory Snapshot Publish
on:
  issues:
    types: [opened, reopened]
permissions: {}
concurrency:
  group: site-snapshot-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  snapshot:
    permissions: {contents: write, issues: write}
    if: startsWith(github.event.issue.title, '[SITE-SNAPSHOT]')
    runs-on: ubuntu-latest
    env: {ASTRO_TELEMETRY_DISABLED: '1'}
    outputs:
      auto_deploy: ${{ steps.target.outputs.auto_deploy }}
      publication_approved: ${{ steps.render.outputs.publication_approved }}
      revision: ${{ steps.commit.outputs.sha }}
      site_key: ${{ steps.target.outputs.site_key }}
    steps:
      - name: Authorize repository writer
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.payload.repository;
            const users = new Set([context.actor]);
            if (context.payload.issue) users.add(context.payload.issue.user.login);
            for (const username of users) {
              if (repo.owner.type === 'User' && username === repo.owner.login) continue;
              let permission;
              try {
                const r = await github.rest.repos.getCollaboratorPermissionLevel({
                  ...context.repo, username
                });
                permission = r.data.permission;
              } catch (error) {
                throw new Error(`Cannot authorize ${username}; no privileged processing allowed`);
              }
              if (!['admin', 'maintain', 'write'].includes(permission)) {
                throw new Error(`Untrusted actor/author: ${username}`);
              }
            }
      - name: Checkout trusted control plane
        uses: actions/checkout@v4
        with: {ref: main, path: control}
      - name: Resolve registered site
        id: target
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          sys.path.insert(0, 'control/site-factory/engine')
          from render_snapshot import parse_payload
          p = parse_payload(os.environ['ISSUE_BODY'])
          target = json.load(open('control/.github/site-factory-sites.json'))['sites'].get(p['SITE_KEY'])
          if not target:
              raise SystemExit('Unregistered SITE_KEY')
          for key, field in [('TARGET_REPO','repo'),('TARGET_BRANCH','branch'),('TARGET_ROOT','root')]:
              if p[key] != target[field]: raise SystemExit(f'{key} registry mismatch')
          if target['repo'] != os.environ['GITHUB_REPOSITORY']:
              raise SystemExit('Cross-repository publishing is not supported')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, value in {
                  'site_key':p['SITE_KEY'], 'branch':target['branch'], 'root':target['root'],
                  'site_url':target['siteUrl'],
                  'indexable':str(bool(target.get('productionEnabled'))).lower(),
                  'auto_deploy':str(bool(target.get('productionEnabled') and target.get('launchMode') == 'live' and target.get('autoDeploySnapshots', True) and not target.get('growthPaused', False))).lower()
              }.items(): out.write(f'{key}={value}\n')
          PYTHON
      - name: Checkout target snapshot baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0
          path: target
      - name: Setup Node
        uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Render immutable snapshot into registered renderer
        id: render
        env: {ISSUE_BODY: "${{ github.event.issue.body }}"}
        run: |
          python3 control/site-factory/engine/render_snapshot.py --registry control/.github/site-factory-sites.json --workspace target | tee snapshot-render-result.json
          python3 - <<'PYTHON'
          import json,os
          result=json.load(open('snapshot-render-result.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('publication_approved='+str(result['publicationApproved']).lower()+'\n')
          PYTHON
      - name: Validate, build and QA preview
        working-directory: target/${{ steps.target.outputs.root }}
        env:
          SITE_URL: ${{ steps.target.outputs.site_url }}
          SITE_INDEXABLE: ${{ steps.target.outputs.indexable }}
        run: |
          npm install
          npm run build
          python3 scripts/qa_static.py
          npx --yes wrangler@latest deploy --dry-run --outdir .wrangler-dry-run
      - name: Save reviewable preview
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-preview-${{ github.event.issue.number }}
          path: target/${{ steps.target.outputs.root }}/dist/
          retention-days: 7
      - name: Commit validated snapshot with race-safe retry
        if: steps.render.outputs.publication_approved == 'true'
        id: commit
        env:
          ROOT: ${{ steps.target.outputs.root }}
          BRANCH: ${{ steps.target.outputs.branch }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          SITE_URL: ${{ steps.target.outputs.site_url }}
          SITE_INDEXABLE: ${{ steps.target.outputs.indexable }}
        run: |
          set -euo pipefail
          cd target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in $(seq 1 8); do
            git restore -- "$ROOT/src/data/build-revision.json" 2>/dev/null || true
            git add "$ROOT/src/content/articles" "$ROOT/src/data" 2>/dev/null || git add "$ROOT/src/data"
            if git diff --cached --quiet; then
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Publish validated snapshot from issue #${{ github.event.issue.number }}"
            if git push origin "HEAD:$BRANCH"; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" = 8 ]; then exit 1; fi
            sleep $((attempt * 2))
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            python3 ../control/site-factory/engine/render_snapshot.py --registry ../control/.github/site-factory-sites.json --workspace .
            (cd "$ROOT"; npm install; npm run build; python3 scripts/qa_static.py; npx --yes wrangler@latest deploy --dry-run --outdir .wrangler-dry-run)
          done
      - name: Report committed snapshot state
        if: steps.render.outputs.publication_approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
          SITE_KEY: ${{ steps.target.outputs.site_key }}
          AUTO_DEPLOY: ${{ steps.target.outputs.auto_deploy }}
        run: |
          gh issue comment -R "$GITHUB_REPOSITORY" "${{ github.event.issue.number }}" --body "Site snapshot processed. PIPELINE_STATE: snapshot_committed. site=$SITE_KEY Commit: $SHA. Snapshot/build/static QA/dry-run passed. Production requested=$AUTO_DEPLOY; live verification is a separate deployment result. Preview: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Report legacy preview awaiting explicit content approval
        if: steps.render.outputs.publication_approved != 'true'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh issue comment -R "$GITHUB_REPOSITORY" "${{ github.event.issue.number }}" --body "PIPELINE_STATE: preview_ready_approval_required. Legacy queue payload lacks verified content approval metadata; preview/QA passed but no site branch was changed and no deployment was requested. Approve the exact snapshot hash after reviewing the preview, then create a new frozen approved request. Evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Report actionable failure without closing the queue issue
        if: failure()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh issue comment -R "$GITHUB_REPOSITORY" "${{ github.event.issue.number }}" --body "PIPELINE_STATE: failed. No live_verified result was established. Inspect $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, repair the frozen payload or failed gate, then reopen this issue to retry safely."
  deploy-approved-snapshot:
    permissions: {contents: read, issues: write}
    needs: snapshot
    if: needs.snapshot.outputs.auto_deploy == 'true' && needs.snapshot.outputs.publication_approved == 'true'
    uses: joseungil-kr/fwith-site-factory/.github/workflows/site-production-deploy.yml@main
    with:
      site_key: ${{ needs.snapshot.outputs.site_key }}
      expected_revision: ${{ needs.snapshot.outputs.revision }}
      source_snapshot_issue: ${{ format('{0}', github.event.issue.number) }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
