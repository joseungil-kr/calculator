name: Site Factory Snapshot Publish

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  snapshot:
    if: startsWith(github.event.issue.title, '[SITE-SNAPSHOT]')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate target site
        id: target
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import os

          body = os.environ.get("ISSUE_BODY", "")
          lines = body.splitlines()

          def value(key):
              prefix = key + ": "
              line = next((x for x in lines if x.startswith(prefix)), None)
              if line is None:
                  raise SystemExit(f"Missing {key}")
              return line[len(prefix):].strip()

          site_key = value("SITE_KEY")
          target_repo = value("TARGET_REPO")
          target_branch = value("TARGET_BRANCH")
          target_root = value("TARGET_ROOT")

          allowed = {
              "ansan-flower-test": {
                  "repo": "joseungil-kr/fwith-site-factory",
                  "branch": "site-factory-ansan-v1",
                  "root": "site-factory/ansan-flower",
              },
              "suwon-flower-test": {
                  "repo": "joseungil-kr/fwith-site-factory",
                  "branch": "site-factory-suwon-v1",
                  "root": "site-factory/suwon-flower",
              },
          }

          if site_key not in allowed:
              raise SystemExit(f"Unsupported SITE_KEY: {site_key}")
          expected = allowed[site_key]
          if target_repo != expected["repo"]:
              raise SystemExit(f"Unexpected target_repo: {target_repo}")
          if target_branch != expected["branch"]:
              raise SystemExit(f"Unexpected target_branch: {target_branch}")
          if target_root != expected["root"]:
              raise SystemExit(f"Unexpected target_root: {target_root}")

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write(f"site_key={site_key}\n")
              fh.write(f"branch={target_branch}\n")
              fh.write(f"root={target_root}\n")
          PY

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0

      - name: Parse immutable snapshot and render Git artifacts
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          EXPECTED_SITE_KEY: ${{ steps.target.outputs.site_key }}
          EXPECTED_BRANCH: ${{ steps.target.outputs.branch }}
          EXPECTED_ROOT: ${{ steps.target.outputs.root }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import textwrap
          from urllib.parse import urlparse

          body = os.environ.get("ISSUE_BODY", "")
          lines = body.splitlines()

          def line_value(key):
              prefix = key + ": "
              line = next((x for x in lines if x.startswith(prefix)), None)
              if line is None:
                  raise SystemExit(f"Missing {key}")
              return line[len(prefix):].strip()

          def optional_line_value(key, default):
              prefix = key + ": "
              line = next((x for x in lines if x.startswith(prefix)), None)
              return default if line is None else line[len(prefix):].strip()

          def block(begin, end):
              if begin not in body or end not in body:
                  raise SystemExit(f"Missing block {begin}")
              return body.split(begin, 1)[1].split(end, 1)[0].strip("\n")

          def optional_block(begin, end):
              if begin not in body or end not in body:
                  return ""
              return body.split(begin, 1)[1].split(end, 1)[0].strip("\n")

          record_id = line_value("PUBLISH_QUEUE_RECORD_ID")
          site_key = line_value("SITE_KEY")
          page_key = line_value("PAGE_KEY")
          draft_key = line_value("DRAFT_KEY")
          source_record_id = line_value("SOURCE_RECORD_ID")
          snapshot_id = line_value("SNAPSHOT_ID")
          target_repo = line_value("TARGET_REPO")
          target_branch = line_value("TARGET_BRANCH")
          target_root = line_value("TARGET_ROOT")
          slug = line_value("SLUG")
          category = line_value("CATEGORY")
          route_type = optional_line_value("ROUTE_TYPE", "category")
          structure_type = line_value("STRUCTURE_TYPE")
          page_type = optional_line_value("PAGE_TYPE", "")
          content_role = optional_line_value("CONTENT_ROLE", "")
          localization_policy = optional_line_value("LOCALIZATION_POLICY", "")
          region = line_value("REGION")
          verified_at = line_value("VERIFIED_AT")
          title = block("---BEGIN-TITLE---", "---END-TITLE---")
          description = block("---BEGIN-DESCRIPTION---", "---END-DESCRIPTION---")
          content_md = block("---BEGIN-CONTENT---", "---END-CONTENT---")
          source_urls = [x.strip() for x in block("---BEGIN-SOURCES---", "---END-SOURCES---").splitlines() if x.strip()]
          source_names = [x.strip() for x in optional_block("---BEGIN-SOURCE-NAMES---", "---END-SOURCE-NAMES---").splitlines() if x.strip()]
          source_types = [x.strip() for x in optional_block("---BEGIN-SOURCE-TYPES---", "---END-SOURCE-TYPES---").splitlines() if x.strip()]
          related_page_keys = [x.strip() for x in optional_block("---BEGIN-RELATED-PAGE-KEYS---", "---END-RELATED-PAGE-KEYS---").splitlines() if x.strip()]
          if not source_urls:
              raise SystemExit("Missing source URL: Site Factory snapshots require at least one verified source URL")

          if not page_type:
              page_type = {
                  "funeral": "funeral-facility",
                  "flower-knowledge": "flower-knowledge",
                  "order-help": "order-help",
              }.get(category, "general-guide")
          if not content_role:
              content_role = "informational-pillar" if route_type == "top_level" else "question-answer"
          if not localization_policy:
              localization_policy = "global" if category == "flower-knowledge" else "local-optional"

          if site_key != os.environ["EXPECTED_SITE_KEY"]:
              raise SystemExit(f"Unexpected site_key: {site_key}")
          if target_repo != "joseungil-kr/fwith-site-factory":
              raise SystemExit(f"Unexpected target_repo: {target_repo}")
          if target_branch != os.environ["EXPECTED_BRANCH"]:
              raise SystemExit(f"Unexpected target_branch: {target_branch}")
          if target_root != os.environ["EXPECTED_ROOT"]:
              raise SystemExit(f"Unexpected target_root: {target_root}")

          if not slug or len(slug) > 80 or any(ch in slug for ch in "/\\?#"):
              raise SystemExit(f"Unsafe slug: {slug}")
          if slug in {".", ".."} or ".." in slug:
              raise SystemExit(f"Unsafe slug: {slug}")
          if not all(ch.isalnum() or ch == "-" for ch in slug):
              raise SystemExit(f"Slug must contain only Unicode letters/numbers or hyphen: {slug}")

          if category not in {"guide","funeral","places","occasions","flower-knowledge","order-help"}:
              raise SystemExit(f"Unsafe category: {category}")
          if page_type not in {"general-guide","funeral-facility","hospital","station-transit","opening-business","event-venue","flower-knowledge","order-help"}:
              raise SystemExit(f"Unsafe page_type: {page_type}")
          if content_role not in {"informational-pillar","question-answer"}:
              raise SystemExit(f"Unsafe content_role: {content_role}")
          if localization_policy not in {"local-required","local-optional","global"}:
              raise SystemExit(f"Unsafe localization_policy: {localization_policy}")
          if route_type not in {"category","top_level"}:
              raise SystemExit(f"Unsafe route_type: {route_type}")
          if not re.fullmatch(r"rec[A-Za-z0-9]{14}", source_record_id):
              raise SystemExit(f"Invalid source record: {source_record_id}")
          if not re.fullmatch(r"rec[A-Za-z0-9]{14}", record_id):
              raise SystemExit(f"Invalid queue record: {record_id}")
          for source_url in source_urls:
              parsed = urlparse(source_url)
              if parsed.scheme != "https" or not parsed.netloc:
                  raise SystemExit(f"Invalid source URL: {source_url}")

          root = pathlib.Path(target_root)
          safe_filename = page_key + ".md"
          article_rel = pathlib.PurePosixPath("src/content/articles") / safe_filename
          article_path = root / article_rel
          manifest_path = root / "src/data/publish-manifest.json"
          page_map_path = root / "src/data/page-map.json"

          if not manifest_path.exists() or not page_map_path.exists():
              raise SystemExit("Snapshot baseline files are missing")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          page_map = json.loads(page_map_path.read_text(encoding="utf-8"))

          url = f"/{slug}/" if route_type == "top_level" else f"/{category}/{slug}/"
          verified_date = verified_at[:10]
          quote = lambda s: json.dumps(s, ensure_ascii=False)
          sources_yaml = "\n".join("  - " + quote(u) for u in source_urls)

          structured_sources_yaml = ""
          if source_names or source_types:
              rows = []
              for idx, source_url in enumerate(source_urls):
                  source_name = source_names[idx] if idx < len(source_names) else urlparse(source_url).netloc
                  source_type = source_types[idx] if idx < len(source_types) else "reference"
                  if source_type not in {"official","facility","education","professional","reference"}:
                      source_type = "reference"
                  rows.extend([
                      "  - name: " + quote(source_name),
                      "    url: " + quote(source_url),
                      "    type: " + source_type,
                      "    verifiedAt: " + verified_date,
                  ])
              structured_sources_yaml = "\nsources:\n" + "\n".join(rows)

          related_yaml = ""
          if related_page_keys:
              related_yaml = "\nrelatedPageKeys:\n" + "\n".join("  - " + quote(key) for key in related_page_keys)

          article = f"""---
          pageKey: {page_key}
          snapshotId: {snapshot_id}
          sourceDraftKey: {draft_key}
          sourceRecordId: {source_record_id}
          slug: {quote(slug)}
          routeType: {route_type}
          title: {quote(title)}
          description: {quote(description)}
          category: {category}
          structureType: {structure_type}
          pageType: {page_type}
          contentRole: {content_role}
          localizationPolicy: {localization_policy}
          region: {region}
          verifiedAt: {verified_date}
          sourceUrls:
          {sources_yaml}{structured_sources_yaml}{related_yaml}
          draftStatus: approved
          ---

          {content_md}
          """
          article = textwrap.dedent(article).lstrip()
          article_path.parent.mkdir(parents=True, exist_ok=True)
          article_path.write_text(article.rstrip() + "\n", encoding="utf-8")

          entry = {
              "pageKey": page_key,
              "draftKey": draft_key,
              "sourceRecordId": source_record_id,
              "publishQueueRecordId": record_id,
              "snapshotId": snapshot_id,
              "slug": slug,
              "category": category,
              "routeType": route_type,
              "file": str(article_rel),
              "url": url,
              "status": "approved"
          }
          manifest["schemaVersion"] = 2
          manifest["siteKey"] = site_key
          manifest["pages"] = [p for p in manifest.get("pages", []) if p.get("pageKey") != page_key]
          manifest["pages"].append(entry)
          manifest["pages"].sort(key=lambda p: p["pageKey"])
          manifest["generatedFrom"] = "Airtable Publish Queue"
          manifest["snapshotMode"] = "git-frozen"
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          map_entry = {
              "pageKey": page_key,
              "snapshotId": snapshot_id,
              "slug": slug,
              "category": category,
              "routeType": route_type,
              "url": url,
              "status": "approved",
              "sourceRecordId": source_record_id
          }
          page_map["schemaVersion"] = 2
          page_map["siteKey"] = site_key
          page_map["pages"] = [p for p in page_map.get("pages", []) if p.get("pageKey") != page_key]
          page_map["pages"].append(map_entry)
          page_map["pages"].sort(key=lambda p: p["pageKey"])
          page_map_path.write_text(json.dumps(page_map, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          print(f"Rendered snapshot {snapshot_id} site={site_key} route={route_type} url={url} -> {article_path}")
          PY

      - name: Validate and build snapshot before push
        working-directory: ${{ steps.target.outputs.root }}
        run: |
          npm install
          npm run build

      - name: Deterministic static SEO QA
        working-directory: ${{ steps.target.outputs.root }}
        run: python3 scripts/qa_static.py

      - name: Cloudflare Workers deploy dry run
        working-directory: ${{ steps.target.outputs.root }}
        run: npx --yes wrangler@latest deploy --dry-run --outdir .wrangler-dry-run

      - name: Commit and push snapshot
        id: commit
        env:
          ROOT: ${{ steps.target.outputs.root }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT/src/content/articles/" \
                  "$ROOT/src/data/publish-manifest.json" \
                  "$ROOT/src/data/page-map.json"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish Site Factory snapshot from issue #${{ github.event.issue.number }}"
            git push origin "HEAD:$BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Ansan production deployment
        if: steps.commit.outputs.changed == 'true' && steps.target.outputs.site_key == 'ansan-flower-test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ansan-cloudflare-production-deploy.yml --ref site-factory-ansan-v1

      - name: Trigger Ansan exact live QA
        if: steps.commit.outputs.changed == 'true' && steps.target.outputs.site_key == 'ansan-flower-test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ansan-live-qa.yml --ref site-factory-ansan-v1

      - name: Trigger Ansan IndexNow
        if: steps.commit.outputs.changed == 'true' && steps.target.outputs.site_key == 'ansan-flower-test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ansan-indexnow-production.yml --ref site-factory-ansan-v1

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          SITE_KEY: ${{ steps.target.outputs.site_key }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Site snapshot processed. site=$SITE_KEY snapshot/build/SEO QA/Cloudflare dry-run passed. changed=$CHANGED Commit: $SHA"
          gh issue close "${{ github.event.issue.number }}"
