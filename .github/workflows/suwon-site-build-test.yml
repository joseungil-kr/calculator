name: Suwon v1.2 Build Test
on:
  push:
    branches: [site-factory-suwon-v1]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: site-factory/suwon-flower}}
    env: {SITE_FACTORY_REVISION: "${{ github.sha }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm run build
      - run: npx --yes wrangler@latest deploy --dry-run --outdir .wrangler-dry-run
