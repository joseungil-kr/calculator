name: Seongnam Production Domain Attach

on:
  workflow_dispatch:
    inputs:
      confirm_unused:
        description: Confirm seongnam.fwith.kr is unused and authorize binding it to the registered Seongnam production Worker.
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: site-production-${{ github.repository }}
  cancel-in-progress: false
jobs:
  attach:
    if: github.ref == 'refs/heads/site-factory-seongnam-v2'
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ inputs.confirm_unused }}" = true
      - uses: actions/checkout@v4
        with: {ref: ${{ github.sha }}, persist-credentials: false}
      - name: Assert exact Seongnam binding contract
        run: |
          python3 - <<'PY'
          import json
          s=json.load(open('.github/site-factory-sites.json'))['sites']['seongnam-flower-v2']
          assert s['repo']=='joseungil-kr/fwith-site-factory'
          assert s['branch']=='site-factory-seongnam-v2' and s['root']=='site-factory/seongnam-flower'
          assert s['siteUrl']=='https://seongnam.fwith.kr' and s['worker']=='seongnam-flower-prod-disabled'
          assert s['stagingWorker']=='seongnam-flower-guide-qa' and s['stagingUrl']=='https://seongnam-flower-guide-qa.joseungil.workers.dev'
          assert s['productionEnabled'] is True and s['launchMode']=='live'
          PY
      - name: Attach exact hostname and read back binding
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 site-factory/engine/seongnam_domain_attach.py --operator-confirmed-unused
