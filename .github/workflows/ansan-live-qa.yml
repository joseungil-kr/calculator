name: Ansan Live QA

on:
  push:
    branches:
      - site-factory-ansan-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-qa:
    runs-on: ubuntu-latest
    env:
      BASE: https://ansan-flower-guide-test.joseungil.workers.dev
    steps:
      - name: Wait for live homepage
        run: |
          for i in $(seq 1 18); do
            code=$(curl -sS -o /tmp/home.html -w "%{http_code}" "$BASE/" || true)
            if [ "$code" = "200" ]; then
              echo "Homepage is live"
              exit 0
            fi
            echo "Attempt $i: HTTP $code"
            sleep 10
          done
          exit 1

      - name: Check required live pages
        run: |
          urls=(
            "/"
            "/guide/ansan-flower-guide/"
            "/guide/ansan-flower-form-guide/"
            "/order-help/ansan-same-day-order-checklist/"
            "/guide/"
            "/places/"
            "/occasions/"
            "/flower-knowledge/"
            "/order-help/"
          )
          for path in "${urls[@]}"; do
            code=$(curl -sS -L -o /dev/null -w "%{http_code}" "$BASE$path")
            echo "$path -> $code"
            test "$code" = "200"
          done

      - name: Check homepage SEO markup
        run: |
          curl -fsS "$BASE/" -o /tmp/home.html
          grep -q '<html lang="ko"' /tmp/home.html
          grep -q '<link rel="canonical" href="https://ansanflowerdelivery.com/"' /tmp/home.html
          grep -q '<meta name="description"' /tmp/home.html
          grep -q 'application/ld+json' /tmp/home.html
          grep -q '<h1' /tmp/home.html

      - name: Check article SEO markup
        run: |
          curl -fsS "$BASE/guide/ansan-flower-guide/" -o /tmp/article.html
          grep -q '<h1' /tmp/article.html
          grep -q '안산에서 꽃을 보낼 때' /tmp/article.html
          grep -q '<link rel="canonical" href="https://ansanflowerdelivery.com/guide/ansan-flower-guide/"' /tmp/article.html
          grep -q 'application/ld+json' /tmp/article.html

      - name: Check robots and sitemap
        run: |
          curl -fsS "$BASE/robots.txt" -o /tmp/robots.txt
          grep -q 'User-agent: \*' /tmp/robots.txt
          grep -q 'Sitemap: https://ansanflowerdelivery.com/sitemap-index.xml' /tmp/robots.txt
          curl -fsS "$BASE/sitemap-index.xml" -o /tmp/sitemap-index.xml
          grep -q 'sitemap-0.xml' /tmp/sitemap-index.xml
          curl -fsS "$BASE/sitemap-0.xml" -o /tmp/sitemap-0.xml
          grep -q 'https://ansanflowerdelivery.com/' /tmp/sitemap-0.xml
          grep -q 'https://ansanflowerdelivery.com/guide/ansan-flower-guide/' /tmp/sitemap-0.xml
          grep -q 'https://ansanflowerdelivery.com/guide/ansan-flower-form-guide/' /tmp/sitemap-0.xml
          grep -q 'https://ansanflowerdelivery.com/order-help/ansan-same-day-order-checklist/' /tmp/sitemap-0.xml

      - name: Check 404 handling
        run: |
          code=$(curl -sS -o /tmp/notfound.html -w "%{http_code}" "$BASE/live-qa-definitely-not-found/")
          echo "404 test -> $code"
          test "$code" = "404"
          grep -q '페이지를 찾을 수 없습니다' /tmp/notfound.html

      - name: Check security headers
        run: |
          curl -fsSI "$BASE/" -o /tmp/headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/headers.txt
          grep -qi '^x-frame-options: SAMEORIGIN' /tmp/headers.txt
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' /tmp/headers.txt
          grep -qi '^permissions-policy:' /tmp/headers.txt

      - name: Report test indexing posture
        run: |
          curl -fsS "$BASE/" -o /tmp/home.html
          curl -fsS "$BASE/robots.txt" -o /tmp/robots.txt
          if grep -qi 'name="robots"[^>]*noindex' /tmp/home.html || grep -q '^Disallow: /$' /tmp/robots.txt; then
            echo "Test deployment is protected from indexing."
          else
            echo "::warning::Test deployment is currently indexable. Add noindex/disallow before broader testing."
          fi
