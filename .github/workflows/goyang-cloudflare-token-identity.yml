name: Goyang Existing Cloudflare Token Identity

on:
  workflow_dispatch:
permissions: {}

jobs:
  token-identity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read only existing token ID and status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          try:
              token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
              if not token or token != token.strip() or "\r" in token or "\n" in token:
                  raise ValueError()
              request = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4/user/tokens/verify",
                  headers={"Authorization": "Bearer " + token, "Accept": "application/json"},
                  method="GET",
              )
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=20) as response:
                  if response.status != 200:
                      raise ValueError()
                  raw = response.read(65537)
              if len(raw) > 65536:
                  raise ValueError()
              payload = json.loads(raw)
              if not isinstance(payload, dict) or payload.get("success") is not True:
                  raise ValueError()
              result = payload.get("result")
              if not isinstance(result, dict):
                  raise ValueError()
              token_id, status = result.get("id"), result.get("status")
              if not isinstance(token_id, str) or re.fullmatch(r"[0-9a-fA-F]{32}", token_id) is None:
                  raise ValueError()
              if not isinstance(status, str) or status not in {"active", "disabled", "expired"}:
                  raise ValueError()
              if token_id == token:
                  raise ValueError()
          except Exception:
              raise SystemExit("Token identity verification failed; response withheld.") from None

          print(json.dumps({"id": token_id, "status": status}))
          PY
