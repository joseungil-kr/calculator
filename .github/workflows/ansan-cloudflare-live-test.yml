name: Ansan Cloudflare Live Test

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    if: startsWith(github.event.issue.title, '[SITE-DEPLOY-TEST]')
    runs-on: ubuntu-latest
    steps:
      - name: Authorize repository writer
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.payload.repository;
            const users = new Set([context.actor]);
            if (context.payload.issue) users.add(context.payload.issue.user.login);
            for (const username of users) {
              if (repo.owner.type === 'User' && username === repo.owner.login) continue;
              let permission;
              try {
                const r = await github.rest.repos.getCollaboratorPermissionLevel({
                  ...context.repo, username
                });
                permission = r.data.permission;
              } catch (error) {
                throw new Error(`Cannot authorize ${username}; no privileged processing allowed`);
              }
              if (!['admin', 'maintain', 'write'].includes(permission)) {
                throw new Error(`Untrusted actor/author: ${username}`);
              }
            }
      - name: Checkout Site Factory test branch
        uses: actions/checkout@v4
        with:
          ref: site-factory-ansan-v1

      - name: Verify Cloudflare credentials exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare GitHub Actions credentials are not configured in this repository."
            exit 2
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: site-factory/ansan-flower
        run: npm install

      - name: Validate and build
        working-directory: site-factory/ansan-flower
        run: npm run build

      - name: Static SEO QA
        working-directory: site-factory/ansan-flower
        run: python3 scripts/qa_static.py

      - name: Deploy test Worker
        id: deploy
        working-directory: site-factory/ansan-flower
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@latest deploy 2>&1 | tee deploy.log
          URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | tail -1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ -n "$DEPLOY_URL" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "Cloudflare test deploy succeeded: $DEPLOY_URL"
          else
            gh issue comment "${{ github.event.issue.number }}" --body "Cloudflare test deploy succeeded. Wrangler did not expose a workers.dev URL in the parsed output; inspect the workflow log."
          fi
          gh issue close "${{ github.event.issue.number }}"
