name: Suwon v1.2 Production Deploy
on:
  push:
    branches: [site-factory-suwon-v1]
    paths: ["site-factory/suwon-flower/**",".github/workflows/suwon-production-deploy.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: suwon-production, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: site-factory/suwon-flower}}
    env:
      SITE_FACTORY_REVISION: "${{ github.sha }}"
      CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
      CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm run build
      - run: npx --yes wrangler@latest deploy
      - name: Live v1.2 QA
        env: {EXPECTED: "${{ github.sha }}"}
        run: |
          python3 - <<'PY'
          import os,time,urllib.request
          base='https://suwon.fwith.kr'; expected=os.environ['EXPECTED']
          for i in range(36):
              try:
                  h=urllib.request.urlopen(base+'/',timeout=20).read().decode('utf-8','replace')
                  assert f'name="site-factory-revision" content="{expected}"' in h
                  assert '수원 꽃배달' in h and '1844-0644' in h and '59,000원부터' in h
                  r=urllib.request.urlopen(base+'/robots.txt',timeout=20).read().decode()
                  assert 'Allow: /' in r and 'Sitemap:' in r
                  p=urllib.request.urlopen(base+'/funeral/aju-hospital-funeral-wreath/',timeout=20).read().decode('utf-8','replace')
                  assert '아주대학교병원 장례식장 근조화환' in p
                  print('SUWON V1.2 LIVE QA PASSED'); break
              except Exception as e:
                  if i==35: raise
                  print('wait',i+1,e); time.sleep(5)
          PY
