name: Site Factory Isolated Staging Preview
on:
  workflow_call:
    inputs:
      site_key: {required: true, type: string}
      launch_key: {required: false, type: string, default: ''}
      scope_key: {required: false, type: string, default: ''}
      expected_revision: {required: true, type: string}
      source_snapshot_issue: {required: false, type: string, default: ''}
    secrets:
      CLOUDFLARE_API_TOKEN: {required: true}
      CLOUDFLARE_ACCOUNT_ID: {required: true}
  workflow_dispatch:
    inputs:
      site_key: {description: Registered site key, required: true, type: string}
      launch_key: {description: Exact registered launch for Goyang coverage only, required: false, type: string}
      scope_key: {description: Exact registered scope for Goyang coverage only, required: false, type: string}
      expected_revision: {description: Full preview source commit SHA, required: true, type: string}
  issues:
    types: [opened, reopened]
permissions: {}
concurrency:
  group: site-staging-${{ github.repository }}
  cancel-in-progress: false
jobs:
  preview:
    permissions: {contents: read, issues: write}
    if: inputs.site_key != '' || github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[SITE-STAGING-DEPLOY]')
    runs-on: ubuntu-latest
    env: {ASTRO_TELEMETRY_DISABLED: '1'}
    steps:
      - name: Authorize repository writer
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.payload.repository;
            const users = new Set([context.actor]);
            if (context.payload.issue) users.add(context.payload.issue.user.login);
            for (const username of users) {
              if (repo.owner.type === 'User' && username === repo.owner.login) continue;
              let permission;
              try {
                const r = await github.rest.repos.getCollaboratorPermissionLevel({
                  ...context.repo, username
                });
                permission = r.data.permission;
              } catch (error) {
                throw new Error(`Cannot authorize ${username}; no privileged processing allowed`);
              }
              if (!['admin', 'maintain', 'write'].includes(permission)) {
                throw new Error(`Untrusted actor/author: ${username}`);
              }
            }
      - uses: actions/checkout@v4
        with: {ref: main, path: control}
      - name: Resolve isolated preview target
        id: target
        env: {SITE_KEY: "${{ inputs.site_key }}", REVISION: "${{ inputs.expected_revision }}", LAUNCH_KEY: "${{ inputs.launch_key }}", SCOPE_KEY: "${{ inputs.scope_key }}", ISSUE_BODY: "${{ github.event.issue.body }}"}
        run: |
          python3 - <<'PYTHON'
          import json,os,re
          values=dict(line.split(': ',1) for line in os.environ.get('ISSUE_BODY','').splitlines() if ': ' in line)
          key=os.environ.get('SITE_KEY') or values.get('SITE_KEY','')
          revision=os.environ.get('REVISION') or values.get('EXPECTED_REVISION','')
          site=json.load(open('control/.github/site-factory-sites.json'))['sites'].get(key)
          if not site or site['repo']!=os.environ['GITHUB_REPOSITORY']:raise SystemExit('Unregistered target')
          if key == 'goyang-flower-v2':
              launch=os.environ.get('LAUNCH_KEY') or values.get('LAUNCH_KEY','')
              scope=os.environ.get('SCOPE_KEY') or values.get('SCOPE_KEY','')
              if not launch and not scope:
                  raise SystemExit('Use goyang-canonical-noindex-deploy.yml: legacy staging would revert the bound Goyang canonical')
              headers=[line.split(': ',1)[0] for line in os.environ.get('ISSUE_BODY','').splitlines() if ': ' in line]
              if len(headers)!=len(set(headers)):raise SystemExit('Duplicate issue header')
              import sys
              sys.path.insert(0,'control/site-factory/engine')
              from verify_live import resolve_goyang_coverage_target, goyang_public_reference
              resolved=resolve_goyang_coverage_target(site,os.environ['GITHUB_REPOSITORY'],revision,launch,scope,'preview',version_preview=True)
              public=goyang_public_reference(site)
              resolved.update(public_revision=public['revision'],public_phase=public['phase'],probe_path='/_site-factory/version-probe/'+os.environ['GITHUB_RUN_ID']+'.txt')
              with open(os.environ['GITHUB_OUTPUT'],'a') as out:
                  for k,v in resolved.items():out.write(f'{k}={v}\n')
              raise SystemExit(0)
          config,url=site.get('stagingWranglerConfig'),site.get('stagingUrl')
          if not config or not url or config==site.get('wranglerConfig','wrangler.jsonc') or url.rstrip('/')==site['siteUrl'].rstrip('/'):
              raise SystemExit('No isolated staging configuration: refusing to overwrite production')
          if not re.fullmatch('[0-9a-f]{40}',revision):raise SystemExit('A pinned preview revision is required')
          isolated=site.get('stagingBuildIsolation') is True
          if key=='seongnam-flower-v2' and not isolated:
              raise SystemExit('Seongnam v2 must use the isolated template build path')
          if isolated:
              match=re.fullmatch(r'([a-z0-9]+)-flower-v2',key)
              if not match:raise SystemExit('Invalid isolated v2 identity')
              region=match.group(1)
              paused=site.get('productionEnabled') is False and site.get('launchMode')=='staging'
              approved_live=(key=='seongnam-flower-v2' and site.get('productionEnabled') is True
                             and site.get('launchMode')=='live')
              if not (paused or approved_live):
                  raise SystemExit('Isolated v2 launch policy mismatch')
              if (site.get('templateKey')!='flower-local-v2' or site.get('snapshotRenderer')!='structured-json-v12'
                  or site.get('growthPaused') is not True or site.get('autoDeploySnapshots') is not False
                  or site.get('requireRevisionApproval') is not True or site.get('requireSnapshotApproval') is not True
                  or site.get('indexnowKey')!='' or site.get('naverVerification')!=''
                  or site.get('branch')!='site-factory-'+region+'-v2' or site.get('root')!='site-factory/'+region+'-flower'
                  or site.get('worker')!=region+'-flower-prod-disabled'
                  or site.get('stagingWorker')!=region+'-flower-guide-qa'
                  or url!='https://'+site['stagingWorker']+'.joseungil.workers.dev' or config!='wrangler.staging.jsonc'):
                  raise SystemExit('Isolated v2 paused identity/policy mismatch')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              for k,v in {'site_key':key,'root':site['root'],'url':url,'config':config,'revision':revision,
                          'branch':site['branch'],'isolated':str(isolated).lower(),
                          'build_root':'preview-build' if isolated else 'target/'+site['root'],
                          'staging_worker':site.get('stagingWorker','')}.items():out.write(f'{k}={v}\n')
          PYTHON
      - uses: actions/checkout@v4
        with: {ref: "${{ steps.target.outputs.revision }}", path: target}
      - name: Isolate pinned v2 tree and prove registered branch ancestry
        if: steps.target.outputs.isolated == 'true'
        env: {ROOT: "${{ steps.target.outputs.root }}", REVISION: "${{ steps.target.outputs.revision }}", BRANCH: "${{ steps.target.outputs.branch }}"}
        run: |
          set -euo pipefail
          if [ "$(git -C target rev-parse --is-shallow-repository)" = true ]; then
            git -C target fetch --unshallow origin "$BRANCH"
          else
            git -C target fetch origin "$BRANCH"
          fi
          git -C target merge-base --is-ancestor "$REVISION" "origin/$BRANCH"
          test "$(git -C target rev-parse HEAD)" = "$REVISION"
          mkdir preview-build
          git -C target archive "$REVISION:$ROOT" | tar -xf - -C preview-build
      - name: Extract unchanged fixed Goyang canary baseline
        if: steps.target.outputs.goyang_coverage == 'true'
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse e4eead3e881b3b4c09a60e2af5befb55b6787413:site-factory/goyang-flower)" = 27a45b8e99151c34b966f0a59a96110b91395fad
          mkdir canary-baseline
          git -C target archive e4eead3e881b3b4c09a60e2af5befb55b6787413:site-factory/goyang-flower | tar -xf - -C canary-baseline
      - name: Assert preview cannot route onto production
        working-directory: ${{ steps.target.outputs.build_root }}
        env: {CONFIG: "${{ steps.target.outputs.config }}", ISOLATED: "${{ steps.target.outputs.isolated }}", STAGING_WORKER: "${{ steps.target.outputs.staging_worker }}", SITE_KEY: "${{ steps.target.outputs.site_key }}"}
        run: |
          python3 - <<'PYTHON'
          import json,os
          p=json.load(open('wrangler.jsonc'));s=json.load(open(os.environ['CONFIG']))
          assert s['name']!=p['name'] and s.get('workers_dev') is True
          assert not s.get('routes') and not s.get('route')
          assert s['assets']['directory']=='./dist/'
          if os.environ['ISOLATED']=='true':
              assert s['name']==os.environ['STAGING_WORKER'] and p['name']==s['name'].replace('-guide-qa','-prod-disabled')
              assert 'route' not in s and 'routes' not in s and 'triggers' not in s
              if os.environ['SITE_KEY'] not in ('seongnam-flower-v2','goyang-flower-v2'):
                  assert json.load(open('src/data/site-config.json'))['productionApproved'] is False
          PYTHON
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Build noindex preview and run gates
        id: build
        working-directory: ${{ steps.target.outputs.build_root }}
        env: {SITE_URL: "${{ steps.target.outputs.url }}", SITE_INDEXABLE: 'false', SITE_FACTORY_REVISION: "${{ steps.target.outputs.revision }}", ISOLATED: "${{ steps.target.outputs.isolated }}"}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if [ "$ISOLATED" = true ]; then npm test; fi
          npm run build
          python3 scripts/qa_static.py
      - name: Validate exact Goyang coverage artifact and frozen source
        if: steps.target.outputs.goyang_coverage == 'true'
        env: {ROOT: "${{ steps.target.outputs.build_root }}", REVISION: "${{ steps.target.outputs.revision }}", LAUNCH_KEY: "${{ steps.target.outputs.launch_key }}", SCOPE_KEY: "${{ steps.target.outputs.scope_key }}"}
        run: python3 control/site-factory/engine/verify_live.py --site-key goyang-flower-v2 --root "$ROOT" --baseline-root canary-baseline --registry control/.github/site-factory-sites.json --origin https://goyang.fwith.kr --revision "$REVISION" --launch-key "$LAUNCH_KEY" --scope-key "$SCOPE_KEY" --phase preview --version-preview --validate-only --report goyang-coverage-source.json
      - name: Build protected canonical reference separately
        if: steps.target.outputs.goyang_coverage == 'true'
        env: {PUBLIC_REVISION: "${{ steps.target.outputs.public_revision }}", PUBLIC_PHASE: "${{ steps.target.outputs.public_phase }}", ROOT: "${{ steps.target.outputs.root }}"}
        run: |
          set -euo pipefail
          git -C target merge-base --is-ancestor "$PUBLIC_REVISION" "origin/site-factory-goyang-v2"
          mkdir public-build
          git -C target archive "$PUBLIC_REVISION:$ROOT" | tar -xf - -C public-build
          cd public-build
          npm ci
          export SITE_URL=https://goyang.fwith.kr SITE_FACTORY_REVISION="$PUBLIC_REVISION" SITE_INDEXABLE=false
          if [ "$PUBLIC_PHASE" = production ]; then export SITE_INDEXABLE=true; fi
          npm run build
          python3 scripts/qa_static.py
      - name: Verify public artifact and probe absence before upload
        id: public_before
        if: steps.target.outputs.goyang_coverage == 'true'
        env: {REVISION: "${{ steps.target.outputs.revision }}", LAUNCH_KEY: "${{ steps.target.outputs.launch_key }}", SCOPE_KEY: "${{ steps.target.outputs.scope_key }}", PROBE_PATH: "${{ steps.target.outputs.probe_path }}"}
        run: python3 control/site-factory/engine/verify_live.py --site-key goyang-flower-v2 --root public-build --baseline-root canary-baseline --registry control/.github/site-factory-sites.json --origin https://goyang.fwith.kr --revision "$REVISION" --launch-key "$LAUNCH_KEY" --scope-key "$SCOPE_KEY" --phase preview --version-preview --protect-public --probe-path "$PROBE_PATH" --report goyang-public-before.json
      - name: Verify existing Worker upload preconditions without settings changes
        id: upload_boundary
        if: steps.target.outputs.goyang_coverage == 'true'
        env: {CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"}
        run: python3 control/site-factory/engine/verify_goyang_canonical.py version-upload-preflight --report goyang-binding-before.json
      - name: Record one Goyang upload attempt before mutation
        if: steps.target.outputs.goyang_coverage == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            if (Number(process.env.GITHUB_RUN_ATTEMPT) !== 1) throw new Error('Uncertain upload cannot be rerun automatically; inspect the original result first');
            if (context.payload.issue) {
              const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: context.issue.number});
              if (comments.some(c => c.body.includes('GOYANG_VERSION_UPLOAD_STARTED:'))) throw new Error('This request already attempted upload; inspect that result, do not repeat');
              await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number,
                body: `GOYANG_VERSION_UPLOAD_STARTED: run=${context.runId}. One CLI invocation only; Wrangler may perform its bounded internal API retries. Unknown outcomes require inspection, not a repeated upload.`});
            }
      - name: Upload one immutable noindex Goyang version without deploying traffic
        id: version_upload
        if: steps.target.outputs.goyang_coverage == 'true'
        working-directory: ${{ steps.target.outputs.build_root }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIG: ${{ steps.target.outputs.config }}
          REVISION: ${{ steps.target.outputs.revision }}
          PROBE_PATH: ${{ steps.target.outputs.probe_path }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/goyang-version-upload.ndjson
          WRANGLER_LOG_SANITIZE: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os,pathlib,sys
          sys.path.insert(0,'../control/site-factory/engine')
          from verify_live import validate_goyang_probe_path
          p=pathlib.Path('dist')/validate_goyang_probe_path(os.environ['PROBE_PATH']).lstrip('/')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text('site-factory-version-isolation '+os.environ['REVISION']+'\n')
          PYTHON
          test ! -e "$WRANGLER_OUTPUT_FILE_PATH"
          # Raw logs/NDJSON remain runner-local: they can contain provider metadata.
          if ! npx --yes wrangler@4.146.0 versions upload -c "$CONFIG" --strict --keep-vars > "$RUNNER_TEMP/goyang-upload.log" 2>&1; then
            echo 'Version upload unsuccessful or uncertain. No repeated upload; inspect the provider outcome.'
            exit 1
          fi
          python3 - <<'PYTHON'
          import json,os,pathlib,sys
          sys.path.insert(0,'../control/site-factory/engine')
          from verify_live import read_goyang_version_upload
          result=read_goyang_version_upload(pathlib.Path(os.environ['WRANGLER_OUTPUT_FILE_PATH']).read_text())
          pathlib.Path('../goyang-version-upload.json').write_text(json.dumps(result,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('url='+result['previewUrl']+'\nversion_id='+result['versionId']+'\n')
          print(json.dumps(result))
          PYTHON
      - name: Deploy isolated noindex QA Worker
        id: deploy
        if: steps.target.outputs.goyang_coverage != 'true'
        working-directory: ${{ steps.target.outputs.build_root }}
        env: {CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}", CONFIG: "${{ steps.target.outputs.config }}", ISOLATED: "${{ steps.target.outputs.isolated }}"}
        run: |
          if [ "$ISOLATED" = true ]; then
            npx --yes wrangler@4.146.0 deploy -c "$CONFIG"
          else
            npx --yes wrangler@latest deploy -c "$CONFIG"
          fi
      - name: Recheck active deployment binding and settings after every upload attempt
        if: ${{ always() && steps.target.outputs.goyang_coverage == 'true' && steps.version_upload.outcome != 'skipped' }}
        env: {CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"}
        run: |
          python3 control/site-factory/engine/verify_goyang_canonical.py version-upload-preflight --report goyang-binding-after.json
          python3 control/site-factory/engine/verify_goyang_canonical.py compare-upload-boundary --before goyang-binding-before.json --after goyang-binding-after.json --report goyang-upload-boundary.json
      - name: Verify complete public artifact remains unchanged after upload attempt
        if: ${{ always() && steps.target.outputs.goyang_coverage == 'true' && steps.version_upload.outcome != 'skipped' }}
        env: {REVISION: "${{ steps.target.outputs.revision }}", LAUNCH_KEY: "${{ steps.target.outputs.launch_key }}", SCOPE_KEY: "${{ steps.target.outputs.scope_key }}", PROBE_PATH: "${{ steps.target.outputs.probe_path }}"}
        run: python3 control/site-factory/engine/verify_live.py --site-key goyang-flower-v2 --root public-build --baseline-root canary-baseline --registry control/.github/site-factory-sites.json --origin https://goyang.fwith.kr --revision "$REVISION" --launch-key "$LAUNCH_KEY" --scope-key "$SCOPE_KEY" --phase preview --version-preview --protect-public --probe-path "$PROBE_PATH" --report goyang-public-after.json
      - name: Verify exact returned version URL noindex source and every static asset
        if: steps.target.outputs.goyang_coverage == 'true'
        env: {ROOT: "${{ steps.target.outputs.build_root }}", REVISION: "${{ steps.target.outputs.revision }}", LAUNCH_KEY: "${{ steps.target.outputs.launch_key }}", SCOPE_KEY: "${{ steps.target.outputs.scope_key }}", PROBE_PATH: "${{ steps.target.outputs.probe_path }}"}
        run: python3 control/site-factory/engine/verify_live.py --site-key goyang-flower-v2 --root "$ROOT" --baseline-root canary-baseline --registry control/.github/site-factory-sites.json --origin https://goyang.fwith.kr --revision "$REVISION" --launch-key "$LAUNCH_KEY" --scope-key "$SCOPE_KEY" --phase preview --version-preview --version-upload-result "$RUNNER_TEMP/goyang-version-upload.ndjson" --probe-path "$PROBE_PATH" --report preview-verification.json
      - name: Verify isolated exact-revision preview
        if: steps.target.outputs.goyang_coverage != 'true'
        env: {ORIGIN: "${{ steps.target.outputs.url }}", REVISION: "${{ steps.target.outputs.revision }}"}
        run: python3 control/site-factory/engine/verify_preview.py --origin "$ORIGIN" --revision "$REVISION" --report preview-verification.json
      - name: Save preview artifact
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: isolated-preview-${{ github.run_id }}
          path: |
            ${{ steps.target.outputs.build_root }}/dist/
            preview-verification.json
            goyang-coverage-source.json
            goyang-binding-before.json
            goyang-binding-after.json
            goyang-upload-boundary.json
            goyang-public-before.json
            goyang-public-after.json
            goyang-version-upload.json
          retention-days: 7
      - name: Report issue preview
        if: github.event_name == 'issues'
        env: {GH_TOKEN: "${{ github.token }}", URL: "${{ steps.target.outputs.url }}", VERSION_URL: "${{ steps.version_upload.outputs.url }}", VERSION_ID: "${{ steps.version_upload.outputs.version_id }}", GOYANG_COVERAGE: "${{ steps.target.outputs.goyang_coverage }}", REVISION: "${{ steps.target.outputs.revision }}"}
        run: |
          if [ "$GOYANG_COVERAGE" = true ]; then
            gh issue comment -R "$GITHUB_REPOSITORY" "${{ github.event.issue.number }}" --body "PIPELINE_STATE: preview_verified. Goyang immutable noindex version=$VERSION_ID preview=$VERSION_URL revision=$REVISION. Active deployment, binding, settings and canonical HTML/assets preserved; version-only asset isolation verified. Independent visual QA is still required."
          else
            gh issue comment -R "$GITHUB_REPOSITORY" "${{ github.event.issue.number }}" --body "PIPELINE_STATE: preview_verified. Noindex isolated preview=$URL revision=$REVISION. Production is unchanged. Independent visual QA is still required."
          fi
          gh issue close -R "$GITHUB_REPOSITORY" "${{ github.event.issue.number }}"
